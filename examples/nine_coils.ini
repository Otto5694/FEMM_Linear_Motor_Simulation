# SPDX-License-Identifier: GPL-3.0-only
# Nine coils at six coils per pole pair. Standalone complete configuration.
# Decimal point or decimal comma; separate list values with semicolons.
# Comments start with #. Units are included in parameter names.

[display]
visible = yes
# Viewing time after each solved magnetic position, 0 for maximum speed.
pause_s = 0.3
keep_open = yes
show_mesh = no
show_flux_lines = yes
max_field_t = 2
# Axial GUI view length; 0 shows the complete coil packet. No effect on the model.
view_length_mm = 42
window_width_px = 600
window_height_px = 950

[femm]
# Directory containing femm_gui.exe and femm_headlessw.exe.
program_directory = C:\femm-qt\bin
mesh_mm = 0.22
air_mesh_mm = 8
boundary_padding_mm = 180
solver_tolerance = 1e-8
min_triangle_angle_deg = 20

[magnets]
# Rod length includes end reserve; replace with your actual magnet count.
count = 26
diameter_mm = 10
length_mm = 19.5
# Generic N35 assumptions, not verified data for your particular magnets.
remanence_20c_t = 1.20
temperature_c = 60
remanence_coefficient_per_k = -0.0012
mu_r = 1.05
hcj_20c_a_m = 955000
hcj_coefficient_per_k = -0.00618

[spacers]
thickness_mm = 1.5
diameter_mm = 10
# Exact name from the FEMM material library.
material = 1010 Steel (hot rolled)

[tube]
outer_diameter_mm = 11
# Tube is treated magnetostatically as mu_r=1. No carbon-fiber eddy-current model.

[winding]
# Allowed coil densities: 3, 6 or 12 physical coils PER pole pair.
coils_per_pole_pair = 6
# Total coil count must be an integer divisible by three.
pole_pairs = 1.5
inner_diameter_mm = 13
wire_copper_mm = 0.50
wire_coated_mm = 0.568
wire_resistance_20c_ohm_per_m = 0.0871
copper_density_kg_m3 = 8960
copper_coefficient_per_k = 0.00393
copper_temperature_c = 60
# 0 calculates layers from max_outer_diameter_mm and radial allowance.
layers = 6
# 0 fits the largest integer number within coil pitch and axial allowance.
turns_per_layer = 12
# 0 means no additional diameter limit. Required when layers=0.
max_outer_diameter_mm = 0
radial_allowance_mm = 0.10
axial_allowance_mm = 0.10
parallel_branches_per_phase = 1
# star or delta; ideal balanced conversion, no internal circulating-current solve.
connection = star

[motion]
# Payload and additional moving hardware EXCLUDE copper, which is calculated.
payload_g = 285
additional_moving_mass_g = 50
acceleration_mm_s2 = 60000
speed_m_s = 2
supply_v = 48
planning_peak_current_limit_a = 25
stroke_mm = 300

[operating_points]
# auto: total moving mass * acceleration. Additional values are force targets.
forces_n = auto; 40
# Optional physical winding peak currents, not RMS or DC bus current.
winding_peak_currents_a =

[simulation]
no_load_positions = 12
positions_per_period = 72
electrical_periods = 1
# auto: negative half of one electrical period; otherwise absolute position in mm.
start_position_mm = auto
calculate_inductance = yes
inductance_step_a = 0.1
mesh_check = yes
check_mesh_mm = 0.15
stroke_check_positions_mm = -150; 0; 150
counterfield_check = yes
# Fit sixth harmonic, then validate at NEW intermediate positions.
validate_current_correction = yes
correction_positions = 24

[thermal]
# Optional parametric FEMM thermal model, not a qualified cooling design.
calculate = yes
effective_conductivities_w_mk = 0.5
effective_heat_transfer_w_m2k = 100; 500
coolant_temperatures_c = 60
# auto: continuous back-and-forth travel from stroke, acceleration and speed.
duty_cycle = auto

[output]
# Relative to this INI file's directory.
directory = Results
# 0: first field of each operating point only; 6: also every sixth position.
field_image_every_n_positions = 0
keep_all_models = no
open_report = yes
